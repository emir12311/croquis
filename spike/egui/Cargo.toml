[package]
name = "croquis-egui-spike"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "croquis-egui-spike"

[dependencies]
# Glow keeps the spike small and matches the kind of backend a native Linux app
# would use; wgpu is deliberately not pulled in until Spike C measures it.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
resvg = "0.48"
croquis-sim = { path = "../../crates/croquis-sim" }
croquis-core = { path = "../../crates/croquis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
rodio = { version = "0.23", default-features = false, features = ["playback"] }

# A warning here is a defect that has not bitten yet — an unused fixture, a
# variable nobody reads. `deny` makes the build stop instead of scrolling past.
#
# The table is package-scoped, so it applies to this crate and not to its
# dependencies: a third party's warnings cannot break our build.
[lints.rust]
warnings = "deny"
