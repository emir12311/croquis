name: pr

# What has to hold before anything reaches main: the v0.3 app's own suite, the
# engine's, the editor fallback build, and the packaging script still parsing.
#
# The Tauri app is no longer what ships, so its suites no longer gate a merge —
# but nothing here checks it either, which means v0.2 rots quietly from now on.
# That is the trade the release decision made.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # What an eframe app needs to *build*: ALSA for rodio, and the display
      # headers winit's backends look for. Tests never open a window.
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spike/egui
            crates/croquis-core

      # `croquis-sim`'s build script needs simavr present before the engine can
      # compile at all, so this comes before any cargo step.
      - name: cache the toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup-toolchain.sh') }}

      - name: toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./scripts/setup-toolchain.sh

      # The suite that found the save-path bugs: preset corpus against the frozen
      # v0.2 baseline, the netlist, the editor, the whole UI. It worked locally for
      # a day without CI ever running it.
      - name: app tests
        run: cargo test --manifest-path spike/egui/Cargo.toml

      - name: engine tests
        run: cargo test --manifest-path crates/croquis-core/Cargo.toml

      # The packaging script is code, and a PR that breaks it should say so here
      # rather than at release time.
      - name: packaging scripts parse
        run: |
          bash -n scripts/package.sh
          bash -n scripts/build-toolchain-dist.sh
          bash -n scripts/setup-toolchain.sh
          ./scripts/package.sh rpm-spec >/dev/null
          test -f dist/rpmbuild/SPECS/croquis.spec

      - name: versions agree
        run: node scripts/check-versions.mjs
