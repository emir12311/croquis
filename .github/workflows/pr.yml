name: pr

# The release workflow only runs on a tag, so a pull request used to reach main
# without ever running the suites. This runs the same checks on the PR itself.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04 # the first LTS with webkit2gtk-4.1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libelf-dev zlib1g-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # simavr, avr-gcc and the Arduino core are not committed. Caching them turns
      # a minute of building and a 36 MB download into a restore on most PRs.
      - name: cache the toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup-toolchain.sh') }}

      - name: toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./scripts/setup-toolchain.sh

      - run: npm ci

      # cargo test compiles the Tauri crate, whose build script validates the
      # bundled resource path. It has to exist before the engine tests run.
      - name: trim the toolchain for shipping
        run: ./scripts/build-toolchain-dist.sh

      - name: type-check
        run: npm run check

      - name: frontend tests
        run: npm test

      - name: engine tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
