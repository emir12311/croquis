name: release

# Builds the Linux packages on a clean machine and attaches them to a draft release.
#
# Two reasons this exists rather than building locally: an AppImage wants a machine
# where appimagetool behaves, and the maintainer's upload speed makes a 50 MB release
# painful. It also builds a package on a machine that has never had the toolchain, so
# "it works here" cannot hide a missing file.
on:
  push:
    tags: ['v*']
  workflow_dispatch: # run it by hand from the Actions tab

# Attaching files to a release is a write to the repository, and the default token is
# read-only. Without this the build succeeds and then fails on the last step with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # What the egui app needs to build (libelf is simavr's), plus what the four
      # package formats need: rpmbuild for the rpm, zstd and bsdtar for the Arch
      # package (scripts/package.sh builds it without makepkg, which Ubuntu does
      # not have), and ImageMagick for the icons the desktop entry points at.
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libelf-dev zlib1g-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            rpm zstd xz-utils libarchive-tools imagemagick fakeroot file wget

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # simavr, avr-gcc and the Arduino core are not committed, and the engine's
      # build script needs simavr before anything can compile.
      - name: cache the toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup-toolchain.sh') }}

      - name: toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./scripts/setup-toolchain.sh

      - name: versions agree with the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-versions.mjs "$GITHUB_REF_NAME"

      # A tag should not publish a package that has not passed its own suite.
      - name: tests
        run: cargo test --manifest-path app/Cargo.toml

      # Fetched rather than installed: appimagetool packages are not in the distro
      # and would drag in their own dependence on the runner's FUSE anyway. It is
      # itself an AppImage, so it runs with APPIMAGE_EXTRACT_AND_RUN below.
      - name: appimagetool
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      # One command for every format: scripts/package.sh stages the payload once and
      # wraps it four ways, so the four packages cannot disagree about what is inside.
      - name: packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./scripts/package.sh all

      # Prove the package can do its job before it is offered to anyone: compile the
      # shipped preset sketches using only the toolchain inside the .deb.
      # Compile *and link* a sketch that actually uses the core — delay() pulls in the timer
      # ISR from wiring.c and WInterrupts.c. The earlier guard compiled a toy sketch to an
      # object and stopped, so it passed while a real package could not build anything.
      - name: the package builds a sketch
        run: |
          mkdir -p /tmp/installed
          ar p dist/croquis_*_amd64.deb data.tar.xz | tar -xJf - -C /tmp/installed
          TC=/tmp/installed/usr/lib/croquis/toolchain
          test -x "$TC/avr/bin/avr-g++"
          printf '#include <Arduino.h>\nvoid setup(){pinMode(13,OUTPUT);}\nvoid loop(){digitalWrite(13,HIGH);delay(500);digitalWrite(13,LOW);delay(500);}\n' > /tmp/sk.cpp
          "$TC/avr/bin/avr-g++" -mmcu=atmega328p -DF_CPU=16000000L -DARDUINO=10806 -Os \
            -I"$TC/ArduinoCore-avr-1.8.6/cores/arduino" \
            -I"$TC/ArduinoCore-avr-1.8.6/variants/standard" \
            -c /tmp/sk.cpp -o /tmp/sk.o
          # The shipped cache has to be complete: a packaged toolchain is read-only, so anything
          # missing here can only be compiled at run time, where it cannot be written.
          missing=0
          for src in "$TC"/ArduinoCore-avr-1.8.6/cores/arduino/*.c \
                     "$TC"/ArduinoCore-avr-1.8.6/cores/arduino/*.cpp \
                     "$TC"/ArduinoCore-avr-1.8.6/cores/arduino/*.S; do
            [ -e "$src" ] || continue
            # hooks.c cannot be compiled by this toolchain; yield.c.o stands in for it.
            case "$(basename "$src")" in hooks.c) continue ;; esac
            [ -f "$TC/core-cache/$(basename "$src").o" ] || { echo "not cached: $(basename "$src")"; missing=1; }
          done
          [ -f "$TC/core-cache/yield.c.o" ] || { echo "yield.c.o missing — delay() will not link"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "the shipped core-cache is incomplete"; exit 1; }
          "$TC/avr/bin/avr-gcc" -mmcu=atmega328p /tmp/sk.o "$TC"/core-cache/*.o -o /tmp/sk.elf -lm
          "$TC/avr/bin/avr-objcopy" -O ihex -R .eeprom /tmp/sk.elf /tmp/sk.hex
          test -s /tmp/sk.hex
          echo "the packaged toolchain builds firmware: $(wc -c < /tmp/sk.hex) bytes of hex"

      # The bundled Arduino libraries are the other half of what a package has to
      # carry: a sketch that includes one compiles only if they are where the engine
      # looks, which is next to the code.
      - name: the package carries the Arduino libraries
        run: |
          test -d /tmp/installed/usr/lib/croquis/libraries/DHT
          test -f /tmp/installed/usr/lib/croquis/libraries/DHT/DHT.h
          echo "libraries present: $(ls /tmp/installed/usr/lib/croquis/libraries | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: croquis-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.pkg.tar.zst
          if-no-files-found: warn

      # Notes live in the repository, one file per tag. An inline `body` used to
      # overwrite whatever had been written on the release — including a manual
      # fix list — every time a tag was pushed again.
      - name: release notes exist
        if: startsWith(github.ref, 'refs/tags/')
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.pkg.tar.zst
