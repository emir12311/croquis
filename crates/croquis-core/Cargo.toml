[package]
name = "croquis-core"
version = "0.2.0"
description = "Document, geometry and diagram-format core for Croquis"
authors = ["Mehmet Emir Gündağ"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "croquis_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A warning here is a defect that has not bitten yet. `deny` makes the build stop
# instead of scrolling past, and the table is package-scoped so it cannot be
# tripped by a dependency's warnings.
[lints.rust]
warnings = "deny"
