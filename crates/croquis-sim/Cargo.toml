[package]
name = "croquis-sim"
version = "0.2.0"
description = "AVR compilation and simavr runtime for Croquis"
authors = ["Mehmet Emir Gündağ"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "croquis_sim"

[build-dependencies]
bindgen = "0.70"
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
